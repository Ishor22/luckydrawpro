<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset Password — Lucky Draw</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body data-theme="dark">
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-logo">🎲 Lucky Draw</a>
    <div class="auth-title">Forgot your password?</div>
    <p class="auth-sub">Enter your email and we'll send you a reset link.</p>

    <form id="forgotForm" novalidate>
      <div class="field">
        <label class="field-label" for="email">Email</label>
        <input type="email" id="email" autocomplete="email" required />
      </div>
      <div class="field-error" id="formError" role="alert"></div>
      <div class="field-error" id="formSuccess" role="status" style="color: var(--success);"></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Send Reset Link</button>
    </form>

    <div class="auth-footer-link">Remembered it? <a href="login.html">Back to log in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
  LD.applyTheme(localStorage.getItem("luckydraw_theme") || "dark");
  var form = document.getElementById("forgotForm");
  var errEl = document.getElementById("formError");
  var okEl = document.getElementById("formSuccess");
  var btn = document.getElementById("submitBtn");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errEl.textContent = ""; okEl.textContent = "";
    var email = document.getElementById("email").value.trim();
    if (!email) { errEl.textContent = "Please enter your email."; return; }

    LD.setBusy(btn, true, "Sending…");
    try {
      await LDAuth.sendPasswordReset(email);
      okEl.textContent = "Check your email for a reset link.";
    } catch (err) {
      errEl.textContent = LD.friendlyError(err);
    }
    LD.setBusy(btn, false, "Send Reset Link");
  });
</script>
</body>
</html>
