<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set New Password — Lucky Draw</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body data-theme="dark">
<div class="auth-shell">
  <div class="auth-card">
    <a href="index.html" class="auth-logo">🎲 Lucky Draw</a>
    <div class="auth-title">Set a new password</div>
    <p class="auth-sub">You clicked a reset link from your email — choose a new password below.</p>

    <form id="resetForm" novalidate>
      <div class="field">
        <label class="field-label" for="password">New password</label>
        <input type="password" id="password" autocomplete="new-password" required />
        <div class="hint" style="margin:6px 0 0;">At least 6 characters.</div>
      </div>
      <div class="field-error" id="formError" role="alert"></div>
      <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Update Password</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script>
  LD.applyTheme(localStorage.getItem("luckydraw_theme") || "dark");
  var form = document.getElementById("resetForm");
  var errEl = document.getElementById("formError");
  var btn = document.getElementById("submitBtn");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    errEl.textContent = "";
    var pw = document.getElementById("password").value;
    if (!pw || pw.length < 6) { errEl.textContent = "Password must be at least 6 characters."; return; }

    LD.setBusy(btn, true, "Updating…");
    try {
      await LDAuth.updatePassword(pw);
      LD.toast("Password updated. You can now log in.", "success");
      setTimeout(function () { window.location.href = "login.html"; }, 1200);
    } catch (err) {
      errEl.textContent = LD.friendlyError(err);
      LD.setBusy(btn, false, "Update Password");
    }
  });
</script>
</body>
</html>
